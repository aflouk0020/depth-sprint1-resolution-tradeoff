# ------------------------------------------------------------
# Sprint 2 – LOCKED Experiment Configuration
# Project: Architecture Efficiency Comparison
# Owner: Taha Aflouk
# ------------------------------------------------------------

project:
  name: "depth_sprint2_architecture_comparison"
  sprint: "Sprint 2"
  objective: >
    Compare architectural efficiency under a strictly controlled protocol by
    evaluating inference speed and reference-based structural consistency
    across fixed resolutions.

model:
  name: "Depth-Anything-V2-Small"
  model_id: "depth-anything/Depth-Anything-V2-Small-hf"
  revision: "5426e4f0f36572d16453bbda7a8389317b1bef99"
  framework: "pytorch"
  device_priority: ["cuda", "mps", "cpu"]
  precision: "fp32"
  batch_size: 1
  inference_mode: "eval"
  processor:
    use_fast: false

sprint2:
  models:
    - label: "depthanything"
      model_id: "depth-anything/Depth-Anything-V2-Small-hf"
      revision: "5426e4f0f36572d16453bbda7a8389317b1bef99"
      use_fast: false
      checkpoint_sha256: ""

    - label: "midasv2"
      model_id: "intel-isl/MiDaS"
      revision: "MiDaS_small"
      use_fast: false
      checkpoint_sha256: ""

dataset:
  master_video_required: true
  master_video_path: "data/processed/S2_Main_Approach_h264.mp4"
  description: "Dynamic forward-approach indoor obstacle scenario"
  camera_device: "OnePlus 13"
  expected_orientation: "landscape"
  expected_width: 1920
  expected_height: 1080
  expected_sha256: "acc658f11b2ab9b3c194a9ea90f517ff7c76829ca07f0ae74d6a5677ab8126cb"
  expected_fps: 30.0
  expected_frames: 313
  expected_duration_seconds: 10.4333

resolutions:
  reference: [1920, 1080]
  test_levels:
    - [1920, 1080]
    - [1280, 720]
    - [854, 480]

preprocessing:
  color_space: "RGB"
  normalize: false
  resize_library: "OpenCV"
  downscale_interpolation: "bicubic"
  upscale_interpolation: "bicubic"

roi:
  enabled: true
  definition:
    type: "fixed_ratio"
    bottom_height_ratio: 0.40
    center_width_ratio: 0.60
  output_mask_path: "outputs/tables/roi_mask.png"

reference_protocol:
  reference_file: "reference_depth/reference_depth_1080_stack.npy"
  reference_sha256: "e16297796e9acd0f4b86f9ced181f5a1f75cba8986368271681ea28ba973a813"
  reference_device: "cuda"
  warmup_frames: 10
  measure_frames: 50

timing:
  warmup_frames: 10
  measure_frames: 50
  measure: "inference_only"
  preload_frames_into_memory: true
  repeats_per_resolution: 1
  official_fps_device: "cuda"
  real_time_threshold_fps: 15
  report:
    save_path: "outputs/tables/timing_summary.csv"

metrics:
  compute_full_frame: true
  compute_roi: true
  rmse: true
  absrel: true
  absrel_epsilon: 1e-6

outputs:
  tables:
    results_csv: "outputs/tables/results_architecture_comparison.csv"
    video_info_txt: "outputs/tables/video_info.txt"

compliance:
  locked_config: true
  require_master_video_sha256_match: true
